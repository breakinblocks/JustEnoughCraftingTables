plugins {
    id 'base'
    id 'net.neoforged.moddev' version '2.0.144' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.18.4' apply false
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0' apply false
}

allprojects {
    version = "${minecraft_version}-${mod_version}"
    group = project.maven_group
}

tasks.named('build') { dependsOn ':neoforge:build', ':fabric:build' }
tasks.named('clean') { dependsOn ':neoforge:clean', ':fabric:clean' }
