side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[29.47,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="craftingtweaks"
type="optional"
versionRange="[26.1.2,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jade"
type="optional"
versionRange="[26.1,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
