import org.slf4j.event.Level

plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin'
}

version = "${minecraft_version}-${mod_version}"
group = project.maven_group

base {
    archivesName = "${archives_base_name}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = Level.DEBUG
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            gameDirectory = project.file('runs/gametest')
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', rootProject.file('common/src/generated/resources/').getAbsolutePath(), '--existing', rootProject.file('common/src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.gametest)

sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDirs rootProject.file('common/src/main/resources'), rootProject.file('common/src/generated/resources')

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared'
                url = 'https://maven.blamejared.com'
            }
        }
        filter {
            includeGroup 'mezz.jei'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'TerraformersMC'
                url = 'https://maven.terraformersmc.com/releases'
            }
        }
        filter {
            includeGroup 'dev.emi'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

def withMod = { String name -> project.findProperty("with_${name}")?.toString()?.toBoolean() ?: false }

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    compileOnly "maven.modrinth:crafting-tweaks:${craftingtweaks_version}"
    compileOnly "maven.modrinth:polymorph:${polymorph_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"

    if (withMod('jei')) {
        localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") {
            transitive = false
        }
    }
    if (withMod('emi')) {
        localRuntime("dev.emi:emi-neoforge:${emi_version}") {
            transitive = false
        }
    }
    if (withMod('craftingtweaks')) {
        localRuntime "maven.modrinth:crafting-tweaks:${craftingtweaks_version}"
        localRuntime "maven.modrinth:balm:${balm_version}"
    }
    if (withMod('polymorph')) {
        localRuntime "maven.modrinth:polymorph:${polymorph_version}"
    }
    if (withMod('jade')) {
        localRuntime "maven.modrinth:jade:${jade_version}"
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        version: version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_authors: mod_authors,
        mod_license: mod_license,
        mod_description: mod_description,
        mod_url: mod_url,
        pack_format: pack_format,
        minecraft_version_range: minecraft_version_range,
        neo_version_range: neo_version_range,
        loader_version_range: loader_version_range
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}


tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE.md'))
}

def publishDryRun = project.hasProperty("dryRun") && project.property("dryRun") == "true"

publishMods {
    dryRun = publishDryRun
    file = jar.archiveFile
    def changelogFile = rootProject.file("metadata/changelogs/${mod_version}.md")
    changelog = changelogFile.exists() ? changelogFile.text : "Release ${project.version}"
    displayName = "${mod_name} ${project.version} (NeoForge)"
    type = BETA
    modLoaders.add("neoforge")

    curseforge {
        projectId = "1757848"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraft_version)
        clientRequired = true
        serverRequired = true
        optional("jei", "emi", "jade", "crafting-tweaks", "polymorph")
        incompatible("crafting-station")
    }
}

sourceSets.gametest.java.srcDir rootProject.file('common/src/gametest/java')
