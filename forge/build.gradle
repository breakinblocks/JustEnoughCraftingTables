import org.slf4j.event.Level

plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge'
    id 'me.modmuss50.mod-publish-plugin'
}


version = "${minecraft_version}-${mod_version}"
group = project.maven_group

base {
    archivesName = "${archives_base_name}-forge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

legacyForge {
    enable {
        forgeVersion = "${minecraft_version}-${forge_version}"
        enabledSourceSets = [sourceSets.main, sourceSets.gametest]
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = Level.DEBUG
        }

        client {
            client()
            gameDirectory = project.file('runs/1.20.1/client')
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            gameDirectory = project.file('runs/1.20.1/server')
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            gameDirectory = project.file('runs/1.20.1/gametest')
            systemProperty 'forge.enableGameTest', 'true'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', rootProject.file('common/src/generated/resources/').getAbsolutePath(), '--existing', rootProject.file('common/src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDirs rootProject.file('common/src/main/resources'), rootProject.file('common/src/generated/resources')
sourceSets.gametest.java.srcDir rootProject.file('common/src/gametest/java')
sourceSets.gametest.resources.srcDir rootProject.file('common/src/gametest/resources')

configurations {
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared'
                url = 'https://maven.blamejared.com'
            }
        }
        filter {
            includeGroup 'mezz.jei'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'TerraformersMC'
                url = 'https://maven.terraformersmc.com/releases'
            }
        }
        filter {
            includeGroup 'dev.emi'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

def withMod = { String name -> project.findProperty("with_${name}")?.toString()?.toBoolean() ?: false }

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    modCompileOnly "dev.emi:emi-forge:${emi_version}:api"
    modCompileOnly "maven.modrinth:crafting-tweaks:${craftingtweaks_version}"
    modCompileOnly "maven.modrinth:polymorph:${polymorph_version}"
    modCompileOnly "maven.modrinth:jade:${jade_version}"

    if (withMod('jei')) {
        modRuntimeOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_version}") {
            transitive = false
        }
    }
    if (withMod('emi')) {
        modRuntimeOnly("dev.emi:emi-forge:${emi_version}") {
            transitive = false
        }
    }
    if (withMod('craftingtweaks')) {
        modRuntimeOnly "maven.modrinth:crafting-tweaks:${craftingtweaks_version}"
        modRuntimeOnly "maven.modrinth:balm:${balm_version}"
    }
    if (withMod('polymorph')) {
        modRuntimeOnly "maven.modrinth:polymorph:${polymorph_version}"
    }
    if (withMod('jade')) {
        modRuntimeOnly "maven.modrinth:jade:${jade_version}"
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        version: version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_authors: mod_authors,
        mod_license: mod_license,
        mod_description: mod_description,
        mod_url: mod_url,
        pack_format: pack_format,
        minecraft_version_range: minecraft_version_range,
        forge_version_range: forge_version_range,
        loader_version_range: loader_version_range
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE.md'))
    manifest.attributes(['MixinConfigs': "${mod_id}.mixins.json"])
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

def publishDryRun = project.hasProperty("dryRun") && project.property("dryRun") == "true"

publishMods {
    dryRun = publishDryRun
    file = tasks.named('reobfJar').flatMap { it.archiveFile }
    def changelogFile = rootProject.file("metadata/changelogs/${mod_version}.md")
    changelog = changelogFile.exists() ? changelogFile.text : "Release ${project.version}"
    displayName = "${mod_name} ${project.version} (Forge)"
    type = BETA
    modLoaders.add("forge")

    curseforge {
        projectId = "1757848"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraft_version)
        clientRequired = true
        serverRequired = true
        optional("jei", "emi", "jade", "crafting-tweaks", "polymorph")
        incompatible("crafting-station")
    }
}
