plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom-remap'
    id 'me.modmuss50.mod-publish-plugin'
}

base { archivesName = "${archives_base_name}-fabric" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDirs rootProject.file('common/src/main/resources'), rootProject.file('common/src/generated/resources')

repositories {
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.terraformersmc.com/releases' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.ladysnake.org/releases' }
    maven { url = 'https://maven.twelveiterations.com/repository/maven-public/' }
}

dependencies {
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    mappings loom.officialMojangMappings()
    minecraft "com.mojang:minecraft:${minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "maven.modrinth:crafting-tweaks:${craftingtweaks_fabric_version}"
    modCompileOnly "maven.modrinth:jade:${jade_fabric_version}"
    modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
    modCompileOnly "maven.modrinth:polymorph:${polymorph_fabric_version}"
    if (with_emi.toBoolean()) { modRuntimeOnly "dev.emi:emi-fabric:${emi_version}" }
    if (with_polymorph.toBoolean()) {
        modRuntimeOnly "maven.modrinth:polymorph:${polymorph_fabric_version}"
        modRuntimeOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.0"
        modRuntimeOnly "org.ladysnake.cardinal-components-api:cardinal-components-block:6.1.0"
        modRuntimeOnly "org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.0"
    }
    if (with_jei.toBoolean()) {
        modRuntimeOnly "net.mezzdev.config:mezz_config-1.21.1-fabric:0.5.12"
        modRuntimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}") { transitive = false }
    }
    if (with_jade.toBoolean()) { modRuntimeOnly "maven.modrinth:jade:${jade_fabric_version}" }
    if (with_craftingtweaks.toBoolean()) {
        modRuntimeOnly "maven.modrinth:crafting-tweaks:${craftingtweaks_fabric_version}"
        modRuntimeOnly "maven.modrinth:balm:${balm_fabric_version}"
        modRuntimeOnly "net.blay09.mods:kuma-api-fabric:21.0.8+1.21"
    }
}

processResources {
    def props = [version: project.version, mod_id: mod_id, mod_name: mod_name,
        mod_description: mod_description, mod_license: mod_license, mod_url: mod_url,
        minecraft_version: minecraft_version, fabric_loader_version: fabric_loader_version]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { from rootProject.file('LICENSE.md') }

publishMods {
    dryRun = project.findProperty('dryRun') == 'true'
    file = remapJar.archiveFile
    def changelogFile = rootProject.file("metadata/changelogs/${mod_version}.md")
    changelog = changelogFile.exists() ? changelogFile.text : "Release ${project.version}"
    displayName = "${mod_name} ${project.version} (Fabric)"
    type = BETA
    modLoaders.add('fabric')
    curseforge {
        projectId = '1757848'
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        minecraftVersions.add(minecraft_version)
        clientRequired = true
        serverRequired = true
        requires('fabric-api')
        optional('jei', 'emi', 'jade', 'crafting-tweaks', 'polymorph')
        incompatible('crafting-station')
    }
}


fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'justenoughcraftingtables_tests'
        enableGameTests = true
    }
}
sourceSets.gametest.java.srcDir rootProject.file('common/src/gametest/java')
