plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom'
    id 'me.modmuss50.mod-publish-plugin'
}

base { archivesName = "${archives_base_name}-fabric" }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDirs rootProject.file('common/src/main/resources'), rootProject.file('common/src/generated/resources')

repositories {
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "maven.modrinth:crafting-tweaks:${craftingtweaks_fabric_version}"
    compileOnly "maven.modrinth:jade:${jade_fabric_version}"
    if (with_jei.toBoolean()) {
        runtimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}") { transitive = false }
    }
    if (with_jade.toBoolean()) { runtimeOnly "maven.modrinth:jade:${jade_fabric_version}" }
    if (with_craftingtweaks.toBoolean()) {
        runtimeOnly "maven.modrinth:crafting-tweaks:${craftingtweaks_fabric_version}"
        runtimeOnly "maven.modrinth:balm:${balm_fabric_version}"
    }
}

processResources {
    def props = [version: project.version, mod_id: mod_id, mod_name: mod_name,
        mod_description: mod_description, mod_license: mod_license, mod_url: mod_url,
        minecraft_version: minecraft_version, fabric_loader_version: fabric_loader_version]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { from rootProject.file('LICENSE.md') }

publishMods {
    dryRun = project.findProperty('dryRun') == 'true'
    file = jar.archiveFile
    def changelogFile = rootProject.file("metadata/changelogs/${mod_version}.md")
    changelog = changelogFile.exists() ? changelogFile.text : "Release ${project.version}"
    displayName = "${mod_name} ${project.version} (Fabric)"
    type = STABLE
    modLoaders.add('fabric')
    curseforge {
        projectId = '1757848'
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        minecraftVersions.add(minecraft_version)
        clientRequired = true
        serverRequired = true
        requires('fabric-api')
        optional('jei', 'jade', 'crafting-tweaks')
        incompatible('crafting-station')
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'justenoughcraftingtables_tests'
        enableGameTests = true
        enableClientGameTests = true
    }
}
sourceSets.gametest.java.srcDir rootProject.file('common/src/gametest/java')
